[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wysna"
dynamic = ["version"]
description = "Wysna Programming Language - Statically typed language with C99 compilation, ARC and copy-on-write values"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Washington Yandún" }
]
keywords = ["compiler", "programming-language", "self-hosting", "c99", "static-typing", "copy-on-write", "wysna"]
dependencies = []

[project.scripts]
wysna = "main:main"

[tool.setuptools]
py-modules = ["main", "run_conformance"]
packages = ["lexer", "parser", "checker", "formatter", "runtime", "codegen", "common", "error", "node", "tokens", "hir", "mir", "compiler", "tooling", "stdlib"]

[tool.setuptools.package-data]
runtime = ["*.h"]
stdlib = ["*.wysna"]

[tool.setuptools.dynamic]
version = {attr = "common.Version.WYSNA_VERSION"}
