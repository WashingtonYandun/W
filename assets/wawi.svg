<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Dark Slate) -->
    <radialGradient id="bg-radial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#080c14"/>
    </radialGradient>

    <!-- Cyan Body Gradient -->
    <linearGradient id="cyan-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00bed2"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Deep Navy Outline -->
    <linearGradient id="navy-edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03254c"/>
      <stop offset="100%" stop-color="#001529"/>
    </linearGradient>

    <!-- W Crest Gradient -->
    <linearGradient id="crest-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="40%" stop-color="#00bed2"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>

    <!-- Eye Iris Gradient -->
    <radialGradient id="iris-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="80%" stop-color="#00bed2"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>

    <!-- Drop Shadow for Sticker -->
    <filter id="sticker-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00bed2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g filter="url(#sticker-shadow)">
    <!-- Outer Die-Cut White Sticker Border (Thick unified outline) -->
    <!-- Head + Crest + Antennae + Body Combined Contour -->
    <path d="M 148,82
             C 106,86 86,130 114,166
             C 126,182 144,204 162,228
             C 152,246 146,268 146,292
             C 146,346 170,390 206,412
             C 192,424 186,442 192,460
             C 200,482 226,494 256,494
             C 286,494 312,482 320,460
             C 326,442 320,424 306,412
             C 342,390 366,346 366,292
             C 366,268 360,246 350,228
             C 368,204 386,182 398,166
             C 426,130 406,86 364,82
             C 334,80 306,104 292,130
             L 282,120
             L 256,92
             L 230,120
             L 220,130
             C 206,104 178,80 148,82 Z"
          fill="#FFFFFF"
          stroke="#FFFFFF"
          stroke-width="18"
          stroke-linejoin="round"
          stroke-linecap="round"/>

    <!-- Main Navy Body Shell -->
    <!-- Antennae Base -->
    <path d="M 152,94
             C 122,96 108,128 126,154
             C 138,170 158,198 176,222
             L 194,206
             C 176,182 158,154 148,138
             C 140,126 144,112 156,110
             C 168,108 184,116 196,134
             L 214,120
             C 196,98 174,92 152,94 Z"
          fill="#001e3d"/>
    <path d="M 360,94
             C 390,96 404,128 386,154
             C 374,170 354,198 336,222
             L 318,206
             C 336,182 354,154 364,138
             C 372,126 368,112 356,110
             C 344,108 328,116 316,134
             L 298,120
             C 316,98 338,92 360,94 Z"
          fill="#001e3d"/>

    <!-- Cyan Antennae Core -->
    <path d="M 152,100
             C 132,102 120,124 132,142
             C 142,156 160,184 178,210
             L 186,200
             C 170,176 152,148 144,134
             C 138,124 144,116 152,116
             C 162,116 174,124 186,140
             L 194,132
             C 180,112 164,98 152,100 Z"
          fill="url(#cyan-body)"/>
    <circle cx="144" cy="124" r="16" fill="#00bed2"/>
    <circle cx="144" cy="124" r="10" fill="#67e8f9"/>

    <path d="M 360,100
             C 380,102 392,124 380,142
             C 370,156 352,184 334,210
             L 326,200
             C 342,176 360,148 368,134
             C 374,124 368,116 360,116
             C 350,116 338,124 326,140
             L 318,132
             C 332,112 348,98 360,100 Z"
          fill="url(#cyan-body)"/>
    <circle cx="368" cy="124" r="16" fill="#00bed2"/>
    <circle cx="368" cy="124" r="10" fill="#67e8f9"/>

    <!-- The 'W' Crest on Crown -->
    <!-- Dark Navy Outer Border -->
    <polygon points="256,104 286,156 312,130 286,214 226,214 200,130 226,156"
             fill="#001e3d"/>
    <!-- Cyan Inner Crest with Bevels -->
    <polygon points="256,112 282,156 304,134 280,208 232,208 208,134 230,156"
             fill="url(#crest-grad)"/>
    <!-- Specular highlight on W apex -->
    <polygon points="256,112 268,156 256,168 244,156" fill="#FFFFFF" opacity="0.8"/>

    <!-- Lower Body / Feet -->
    <ellipse cx="256" cy="420" rx="54" ry="48" fill="#001e3d"/>
    <path d="M 206,432 C 196,448 204,476 226,476 C 242,476 248,460 248,442 Z" fill="#001e3d"/>
    <path d="M 306,432 C 316,448 308,476 286,476 C 270,476 264,460 264,442 Z" fill="#001e3d"/>

    <path d="M 210,436 C 202,450 210,472 226,472 C 238,472 244,458 244,444 Z" fill="url(#cyan-body)"/>
    <path d="M 302,436 C 310,450 302,472 286,472 C 274,472 268,458 268,444 Z" fill="url(#cyan-body)"/>

    <!-- Main Torso -->
    <ellipse cx="256" cy="404" rx="48" ry="42" fill="url(#cyan-body)"/>
    <!-- White Belly -->
    <ellipse cx="256" cy="416" rx="28" ry="22" fill="#FFFFFF"/>

    <!-- Head Outer Shell (Navy) -->
    <circle cx="256" cy="288" r="106" fill="#001e3d"/>
    <!-- Head Face (Cyan) -->
    <circle cx="256" cy="288" r="98" fill="url(#cyan-body)"/>

    <!-- Left Eye (Giant Bioluminescent Headlight) -->
    <circle cx="204" cy="282" r="42" fill="#001529"/>
    <circle cx="204" cy="282" r="38" fill="#FFFFFF"/>
    <circle cx="204" cy="282" r="30" fill="url(#iris-grad)"/>
    <circle cx="204" cy="282" r="18" fill="#001529"/>
    <!-- Specular Reflection Dots -->
    <circle cx="194" cy="272" r="8" fill="#FFFFFF"/>
    <circle cx="214" cy="292" r="3.5" fill="#FFFFFF"/>

    <!-- Right Eye (Giant Bioluminescent Headlight) -->
    <circle cx="308" cy="282" r="42" fill="#001529"/>
    <circle cx="308" cy="282" r="38" fill="#FFFFFF"/>
    <circle cx="308" cy="282" r="30" fill="url(#iris-grad)"/>
    <circle cx="308" cy="282" r="18" fill="#001529"/>
    <!-- Specular Reflection Dots -->
    <circle cx="298" cy="272" r="8" fill="#FFFFFF"/>
    <circle cx="318" cy="292" r="3.5" fill="#FFFFFF"/>

    <!-- Cute Smiling Mouth & Nose Dots -->
    <circle cx="251" cy="324" r="2.5" fill="#002855"/>
    <circle cx="261" cy="324" r="2.5" fill="#002855"/>
    <path d="M 242,336 C 248,348 264,348 270,336"
          fill="none"
          stroke="#002855"
          stroke-width="4.5"
          stroke-linecap="round"/>
  </g>
</svg>