name: Solicitar una función
description: Propón una función del lenguaje, extensión de sintaxis, opción del compilador o capacidad de biblioteca estándar.
title: "[Feature]: "
labels: ["enhancement", "design"]
body:
  - type: markdown
    attributes:
      value: |
        Antes de proponer sintaxis o funciones nuevas, revisa la especificación del lenguaje y la documentación pública actual.
  - type: textarea
    id: problem
    attributes:
      label: Problema o motivación
      description: ¿Qué problema resuelve o qué tarea resulta difícil con Wysna hoy?
      placeholder: "Necesito poder..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Solución o sintaxis propuesta
      description: Describe la sintaxis y semántica propuestas con un ejemplo Wysna.
      render: wysna
      placeholder: |
        # Ejemplo de código Wysna
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
      description: ¿Qué otros diseños o soluciones alternativas consideraste?
    validations:
      false
  - type: textarea
    id: impact
    attributes:
      label: Impacto en autoalojamiento y runtime
      description: ¿Cómo afecta al runtime C99, las invariantes ARC/CoW o Wysna Compiler?
    validations:
      false
