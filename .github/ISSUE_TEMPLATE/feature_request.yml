name: Feature Request
description: Propose a new language feature, syntax extension, compiler flag, or standard library capability.
title: "[Feature]: "
labels: ["enhancement", "design"]
body:
  - type: markdown
    attributes:
      value: |
        Before proposing new syntax or features, please check the language specification and current public documentation.
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: What problem would this feature solve, or what is currently difficult to do in Wysna?
      placeholder: "I need to be able to..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution or Syntax
      description: Describe the proposed syntax and semantics with a Wysna example.
      render: wysna
      placeholder: |
        # Proposed Wysna code example
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other designs or workarounds have you considered?
    validations:
      false
  - type: textarea
    id: impact
    attributes:
      label: Impact on Self-Hosting & Runtime
      description: How would this affect the C99 runtime, ARC/CoW invariants, or the Wysna Compiler?
    validations:
      false
