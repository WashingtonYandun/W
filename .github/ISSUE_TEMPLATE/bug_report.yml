name: Reportar un error
description: Reporta un error reproducible del compilador o runtime de Wysna.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Revisa los issues existentes antes de enviar uno nuevo para evitar duplicados.
  - type: textarea
    id: description
    attributes:
      label: Descripción del error
      description: Explica el error de forma clara y concreta.
      placeholder: Describe el comportamiento inesperado...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Código mínimo para reproducir (.wysna)
      description: Incluye un ejemplo mínimo y autocontenido de código Wysna.
      render: wysna
      placeholder: |
        fn main() {
            // Minimal code triggering the bug
        }
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
      description: ¿Qué esperabas que ocurriera?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Salida real o mensaje de error
      description: Pega la salida del compilador o runtime, los diagnósticos o el código de salida.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de Wysna
      description: Salida de `./wysna version` o `./wysna --version`.
      placeholder: "Wysna 0.5.0"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Componente afectado
      options:
        - "Lexer / Tokenizer"
        - "Parser (AST)"
        - "Type Checker (WysnaType, TypeInterner)"
        - "Typed HIR (HirBuilder, HirCCodeGen)"
        - "C99 Runtime (wysna_runtime.h, ARC, CoW)"
        - "Wysna Compiler (Self-Hosted)"
        - "CLI / Formateador (wysna fmt)"
        - "Otro / Desconocido"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Entorno y toolchain
      description: Sistema operativo, compilador C (`clang --version` o `gcc --version`) y versión de Python.
      placeholder: |
        - OS: macOS Sonoma / Linux Ubuntu 22.04 / Windows (WSL)
        - C Compiler: Apple Clang 16.0 / GCC 12.2
        - Python: 3.11.5
    validations:
      required: true
