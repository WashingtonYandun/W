name: Bug Report
description: Report a reproducible bug or incorrect compiler/runtime behavior in W.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please check existing issues before submitting to avoid duplicates.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the unexpected behavior...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproducing Code (.wysna)
      description: Provide a minimal, self-contained Wysna source snippet demonstrating the issue.
      render: wysna
      placeholder: |
        fn main() {
            // Minimal code triggering the bug
        }
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Output / Error Message
      description: Paste the compiler or runtime output, error diagnostics, or exit codes.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Wysna Version
      description: Output of `./wysna version` or `./wysna --version`.
      placeholder: "wysna version 0.2.0"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - "Lexer / Tokenizer"
        - "Parser (AST)"
        - "Type Checker (WType, TypeInterner)"
        - "Typed HIR (HirBuilder, HirCCodeGen)"
        - "C99 Runtime (w_runtime.h, ARC, CoW)"
        - "Wysna Compiler (Self-Hosted)"
        - "CLI / Formatter (w fmt)"
        - "Other / Unknown"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment & Toolchain
      description: Operating System, C compiler version (`clang --version` or `gcc --version`), Python version.
      placeholder: |
        - OS: macOS Sonoma / Linux Ubuntu 22.04 / Windows (WSL)
        - C Compiler: Apple Clang 16.0 / GCC 12.2
        - Python: 3.11.5
    validations:
      required: true
