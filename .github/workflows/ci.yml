name: Wysna Compiler Integration Gates

on:
  push:
    branches: [main, develop, "feat/**", "codex/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      profile:
        description: "Release rejects every unsupported engine/feature row"
        type: choice
        options: [integration, release]
        default: integration

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  wheel-build:
    name: Build Wysna wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the versioned wheel and standalone consumer validator
        run: |
          python -m pip install build==1.6.1 setuptools==84.0.0 wheel==0.48.0
          python -m build --wheel --no-isolation --outdir dist/wheel
          cp tools/validate_wheel.py dist/wheel/validate_wheel.py
          python -m pip freeze > dist/wheel/build-tools.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wysna-wheel
          path: dist/wheel/
          if-no-files-found: error

  installed-wheel:
    name: Installed Wysna wheel (${{ matrix.os }})
    needs: wheel-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CC: clang
    steps:
      # Deliberately do not check out sources in the consumer job.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: wysna-wheel
          path: wheel-artifact
      - name: Verify the installed CLI without checkout access or installed writes
        run: |
          python wheel-artifact/validate_wheel.py --wheel wheel-artifact/*.whl --forbid-source "$GITHUB_WORKSPACE" --report installed-wheel.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-wheel-${{ matrix.os }}
          path: installed-wheel.json
          if-no-files-found: ignore

  conformance:
    name: Conformance (${{ matrix.os }}, ${{ matrix.cc }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, cc: clang}
          - {os: ubuntu-latest, cc: gcc}
          - {os: macos-latest, cc: clang}
    env:
      CC: ${{ matrix.cc }}
      WYSNA_CI_ARTIFACTS: ${{ github.workspace }}/.wysna_cache/ci-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify CI harness failure contracts
        run: |
          python3 -m tests.unit.test_ci_harness
          python3 -m tests.unit.test_hir_return_paths
          python3 -m tests.unit.test_f03_error_unions
          python3 -m tests.unit.test_compilation_session
          python3 -m tests.unit.test_expansion_contracts
          python3 -m tests.unit.test_audit_remediation
          python3 -m tests.unit.test_mir
          python3 -m tests.unit.test_distribution_contract
          python3 -m tests.unit.test_audit_findings
          python3 -m tests.unit.test_standard_toolkit
      - name: Verify runtime, examples and direct selfhost negatives across four engines
        run: python3 tools/ci_conformance.py --profile=${{ inputs.profile || 'integration' }}
      - name: Verify full conformance and SHA256 bootstrap
        run: ./wysna test 2>&1 | tee .wysna_cache/ci-artifacts/conformance.log
      - name: Verify four-engine differential and deterministic fuzz corpus
        run: |
          ./wysna test --differential 20 2>&1 | tee .wysna_cache/ci-artifacts/differential.log
          ./wysna test --fuzz 100 2>&1 | tee .wysna_cache/ci-artifacts/fuzz.log
      - name: Install SQLite development headers on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Verify SQLite FFI against C with sanitizers and persisted data
        run: python3 tools/validate_sqlite_ffi.py --sanitize --report .wysna_cache/ci-artifacts/sqlite-ffi.json
      - name: Verify atomic CSV imports, rollback and process memory against C
        run: python3 tools/validate_sqlite_import.py --sanitize --rows 1000 --samples 1 --report .wysna_cache/ci-artifacts/sqlite-import.json
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.cc }}
          path: .wysna_cache/ci-artifacts/*.json
          if-no-files-found: ignore
      - name: Preserve failure reproductions and bootstrap C
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failures-${{ matrix.os }}-${{ matrix.cc }}
          path: |
            .wysna_cache/ci-artifacts/
            .wysna_cache/compiler*.c
            tests/differential/failures/
            tests/fuzz/failures/

  sanitizers:
    name: Memory safety (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CC: clang
      WYSNA_CI_ARTIFACTS: ${{ github.workspace }}/.wysna_cache/ci-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify the full acyclic runtime and example corpus with ASan and UBSan
        # Linux also enables LSan; Darwin does not support leak detection.
        run: python3 tools/ci_conformance.py --sanitize
      - name: Verify targeted ownership, telemetry and isolated strong-cycle evidence
        run: |
          WYSNA_SANITIZE=1 python3 -m tests.unit.test_audit_remediation
          WYSNA_SANITIZE=1 python3 -m tests.unit.test_mir
          WYSNA_SANITIZE=1 python3 -m tests.unit.test_audit_completion
          WYSNA_SANITIZE=1 python3 -m tests.unit.test_audit_readiness
          WYSNA_SANITIZE=1 python3 -m tests.unit.test_compilation_session
          WYSNA_SANITIZE=1 python3 -m tests.unit.test_audit_findings
          WYSNA_SANITIZE=1 python3 -m tests.unit.test_foundations
          WYSNA_SANITIZE=1 python3 -m tests.unit.test_standard_toolkit
          python3 -m tests.unit.test_phase_a
          python3 -m tests.unit.test_ownership_control_flow
          python3 -m tests.unit.test_f03_ownership
          python3 -m tests.unit.test_cow_telemetry
          python3 -m tests.unit.test_weak_references
      - name: Upload memory coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-coverage-${{ matrix.os }}
          path: .wysna_cache/ci-artifacts/*.json
          if-no-files-found: ignore
      - name: Preserve failing sanitizer reproductions
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: memory-failures-${{ matrix.os }}
          path: |
            .wysna_cache/ci-artifacts/
            .wysna_cache/compiler*.c

  windows-toolchain:
    name: Windows CLI and native C99 smoke
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      CC: clang
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check sources and build with portable host adapters
        run: |
          python -m tests.unit.test_distribution_contract
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python main.py check --stats examples/01_hello_world.wysna
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python main.py build --stats examples/01_hello_world.wysna -o hello.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./hello.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bootstrap Wysna Compiler through the Windows cache lock
        run: |
          python main.py build --backend=selfhost tests/runtime/readiness_patterns.wysna -o patterns.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./patterns.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify persistent resources and executable documentation
        run: |
          python -m tests.unit.test_foundations
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify standard toolkit and native LSP paths
        run: |
          python -m tests.unit.test_audit_findings 2>&1 | Tee-Object -FilePath audit.log
          if ($LASTEXITCODE -ne 0) {
              $line = Get-Content audit.log | Select-String "AssertionError" | Select-Object -First 1
              if ($line) { Write-Host "::error::$line" } else { Get-Content audit.log -Tail 10 | ForEach-Object { Write-Host "::error::$_" } }
              exit $LASTEXITCODE
          }
          python -m tests.unit.test_standard_toolkit 2>&1 | Tee-Object -FilePath toolkit.log
          if ($LASTEXITCODE -ne 0) {
              $line = Get-Content toolkit.log | Select-String "AssertionError" | Select-Object -First 1
              if ($line) { Write-Host "::error::$line" } else { Get-Content toolkit.log -Tail 10 | ForEach-Object { Write-Host "::error::$_" } }
              exit $LASTEXITCODE
          }
      - name: Upload smoke failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failures-windows
          path: |
            audit.log
            toolkit.log
            .wysna_cache/ci-artifacts/
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Package and verify the native SQLite pilot
        run: |
          python tools/package_measurement_pilot.py --output dist/measurement-pilot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload the tested Windows x64 pilot
        uses: actions/upload-artifact@v4
        with:
          name: measurement-pilot-windows-x64
          path: dist/measurement-pilot/
          if-no-files-found: error

  windows-installer:
    name: Windows standalone installer
    needs: wheel-build
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: wysna-wheel
          path: wheel-artifact
      - uses: actions/cache@v4
        with:
          path: .wysna_cache/windows-downloads
          key: windows-runtime-python-3.14.8-zig-0.15.2-v1
      - name: Verify Windows distribution contracts
        run: |
          python -m tests.unit.test_windows_distribution
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bundle Wysna with private Python and a complete C toolchain
        run: |
          $wheel = (Get-ChildItem wheel-artifact/*.whl).FullName
          python tools/package_windows.py --wheel $wheel --output dist/windows-bundle --source-commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the per-user installer
        run: |
          $version = (Get-Content dist/windows-bundle/windows-bundle.json | ConvertFrom-Json).version
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw "Inno Setup 6 is required on the Windows packaging runner" }
          & $compiler /Q "/DBundleDir=$((Resolve-Path dist/windows-bundle).Path)" "/DWVersion=$version" "/DOutputDir=$env:GITHUB_WORKSPACE\dist\windows-installer" packaging/windows/wysna.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test install, native build, repair and uninstall without host dependencies
        run: |
          ./tools/validate_windows_lifecycle.ps1 -Installer (Get-ChildItem dist/windows-installer/*-setup.exe).FullName -ReportDirectory "$env:GITHUB_WORKSPACE\dist\windows-reports"
      - name: Archive the portable distribution and calculate checksums
        run: |
          python -c "import shutil; shutil.make_archive('dist/windows-installer/wysna-windows-x64-portable', 'zip', 'dist/windows-bundle')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist/windows-installer -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content dist/windows-installer/CHECKSUMS.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: wysna-windows-x64-installer
          path: dist/windows-installer/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer-reports
          path: dist/windows-reports/
          if-no-files-found: warn
