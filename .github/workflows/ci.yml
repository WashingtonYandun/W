name: W Compiler Integration Gates

on:
  push:
    branches: [main, develop, "feat/**", "codex/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      profile:
        description: "Release rejects every unsupported engine/feature row"
        type: choice
        options: [integration, release]
        default: integration

defaults:
  run:
    shell: bash

jobs:
  conformance:
    name: Conformance (${{ matrix.os }}, ${{ matrix.cc }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, cc: clang}
          - {os: ubuntu-latest, cc: gcc}
          - {os: macos-latest, cc: clang}
    env:
      CC: ${{ matrix.cc }}
      W_CI_ARTIFACTS: ${{ github.workspace }}/.w_cache/ci-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify CI harness failure contracts
        run: |
          python3 -m tests.unit.test_ci_harness
          python3 -m tests.unit.test_hir_return_paths
          python3 -m tests.unit.test_f03_error_unions
          python3 -m tests.unit.test_compilation_session
          python3 -m tests.unit.test_expansion_contracts
          python3 -m tests.unit.test_audit_remediation
          python3 -m tests.unit.test_mir
      - name: Verify runtime, examples and direct W1 negatives across four engines
        run: python3 tools/ci_conformance.py --profile=${{ inputs.profile || 'integration' }}
      - name: Verify full conformance and SHA256 bootstrap
        run: ./w test 2>&1 | tee .w_cache/ci-artifacts/conformance.log
      - name: Verify four-engine differential and deterministic fuzz corpus
        run: |
          ./w test --differential 20 2>&1 | tee .w_cache/ci-artifacts/differential.log
          ./w test --fuzz 100 2>&1 | tee .w_cache/ci-artifacts/fuzz.log
      - name: Install SQLite development headers on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Verify SQLite FFI against C with sanitizers and persisted data
        run: python3 tools/validate_sqlite_ffi.py --sanitize --report .w_cache/ci-artifacts/sqlite-ffi.json
      - name: Verify atomic CSV imports, rollback and process memory against C
        run: python3 tools/validate_sqlite_import.py --sanitize --rows 1000 --samples 1 --report .w_cache/ci-artifacts/sqlite-import.json
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.cc }}
          path: .w_cache/ci-artifacts/*.json
          if-no-files-found: error
      - name: Preserve failure reproductions and bootstrap C
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failures-${{ matrix.os }}-${{ matrix.cc }}
          path: |
            .w_cache/ci-artifacts/
            .w_cache/compiler*.c
            tests/differential/failures/
            tests/fuzz/failures/

  sanitizers:
    name: Memory safety (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CC: clang
      W_CI_ARTIFACTS: ${{ github.workspace }}/.w_cache/ci-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify the full acyclic runtime and example corpus with ASan and UBSan
        # Linux also enables LSan; Darwin does not support leak detection.
        run: python3 tools/ci_conformance.py --sanitize
      - name: Verify targeted ownership, telemetry and isolated strong-cycle evidence
        run: |
          W_SANITIZE=1 python3 -m tests.unit.test_audit_remediation
          W_SANITIZE=1 python3 -m tests.unit.test_mir
          W_SANITIZE=1 python3 -m tests.unit.test_audit_completion
          W_SANITIZE=1 python3 -m tests.unit.test_audit_readiness
          W_SANITIZE=1 python3 -m tests.unit.test_compilation_session
          python3 -m tests.unit.test_phase_a
          python3 -m tests.unit.test_ownership_control_flow
          python3 -m tests.unit.test_f03_ownership
          python3 -m tests.unit.test_cow_telemetry
          python3 -m tests.unit.test_weak_references
      - name: Upload memory coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-coverage-${{ matrix.os }}
          path: .w_cache/ci-artifacts/*.json
          if-no-files-found: error
      - name: Preserve failing sanitizer reproductions
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: memory-failures-${{ matrix.os }}
          path: |
            .w_cache/ci-artifacts/
            .w_cache/compiler*.c

  windows-toolchain:
    name: Windows CLI and native C99 smoke
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check sources and build with portable host adapters
        run: |
          python main.py check --stats examples/01_hello_world.w
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python main.py build --stats examples/01_hello_world.w -o hello.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./hello.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bootstrap W1 through the Windows cache lock
        run: |
          python main.py build --backend=selfhost tests/runtime/readiness_patterns.w -o patterns.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./patterns.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package and verify the native SQLite pilot
        run: |
          python tools/package_measurement_pilot.py --output dist/measurement-pilot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload the tested Windows x64 pilot
        uses: actions/upload-artifact@v4
        with:
          name: measurement-pilot-windows-x64
          path: dist/measurement-pilot/
          if-no-files-found: error
